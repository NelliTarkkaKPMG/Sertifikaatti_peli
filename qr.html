<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISO 27001 -valmiustesti QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 32px 16px; color: #00338D; background: #fff; }
    h1 { font-size: 34px; margin: 0 0 8px; font-family: "KPMG Bold", Arial, sans-serif; }
    p { font-size: 20px; margin: 0 0 24px; }
    #qr { display: inline-block; padding: 16px; border: 6px solid #00338D; border-radius: 16px; }
    #url { margin-top: 16px; font-size: 14px; color: #64748b; word-break: break-all; }
    input { width: 100%; max-width: 480px; padding: 10px; font-size: 15px; margin-top: 24px; }
    @media print { input, .hint { display: none; } }
  </style>
</head>
<body>
  <img src="assets/logo-blue.svg" alt="KPMG" style="height:56px;margin-bottom:16px">
  <h1>Onko yrityksenne valmis ISO 27001 -sertifiointiin?</h1>
  <h2 style="font-size:24px;margin:0 0 12px;color:#1E49E2">Is your company ready for ISO 27001 certification?</h2>
  <p>Skannatkaa koodi · Scan the code<br><small>Suomeksi tai englanniksi · In Finnish or English</small></p>
  <div id="qr"></div>
  <div id="url"></div>
  <input id="custom" type="text" placeholder="Muuta osoitetta tarvittaessa ja paina Enter">
  <p class="hint" style="font-size:14px;margin-top:8px">Tulosta sivu (Ctrl/Cmd + P) julisteeksi tai roll-upiin.</p>
  <script>
    const base = location.href.replace(/qr\.html.*$/, "");
    const draw = (url) => {
      document.getElementById("qr").innerHTML = "";
      new QRCode(document.getElementById("qr"), { text: url, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById("url").textContent = url;
    };
    const input = document.getElementById("custom");
    input.value = base;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") draw(input.value.trim()); });
    draw(base);
  </script>
</body>
</html>
